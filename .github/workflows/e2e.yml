name: E2E

# quality → core (required) → extended (non-blocking) → publish-report (main only)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  core:
    name: Core tests (required)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_TIER: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Everything not tagged @extended: the brief's happy path and the
      # stubbed API-failure check. These decide whether the run is green.
      - run: npx playwright test --grep-invert @extended
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-core
          path: blob-report/
          retention-days: 14

  extended:
    name: Extended tests (non-blocking)
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Live-data checks and suspected issues: a failure shows here but doesn't
    # turn the run red.
    continue-on-error: true
    env:
      TEST_TIER: extended
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @extended
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-extended
          path: blob-report/
          retention-days: 14

  publish-report:
    name: Publish report to GitHub Pages
    # Also after test failures: that's when the report is most useful.
    if: always() && needs.core.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [core, extended]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A Pages problem must not turn a green test run red.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      # One HTML report covering both tiers.
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report
      - id: deploy
        uses: actions/deploy-pages@v5
