name: E2E

# quality → smoke → e2e → publish-report (main only)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly against the shared review env: catches app or data changes
    # (e.g. the VS-02 zero-result term gaining matches) on days nobody pushes.
    - cron: '0 3 * * *'

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  smoke:
    name: Smoke (@smoke)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Fast gate: if the happy path is broken (env down, selectors changed),
      # stop here instead of spending the full suite's time on it.
      - run: npx playwright test --grep @smoke
      - name: Job summary
        if: always()
        run: node scripts/ci-summary.mjs reports/results.json "Smoke results"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7

  e2e:
    name: Full suite
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Job summary
        if: always()
        env:
          REPORT_URL: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
        run: node scripts/ci-summary.mjs reports/results.json "Full suite results"
      # Self-contained HTML report (screenshots and traces are copied into it).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  publish-report:
    name: Publish report to GitHub Pages
    # Publish failing runs too: that's when the report is most useful.
    if: always() && needs.e2e.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report
      - id: deploy
        uses: actions/deploy-pages@v5
